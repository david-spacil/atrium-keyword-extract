name: Paradata Canonical Drift
on:
  push:
    branches: [test, master]
  pull_request:
    branches: [test, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read   # least privilege: these jobs only ever read the tree

jobs:
  check-drift:
    uses: ufal/atrium-project/.github/workflows/para-drift.reusable.yml@da7a066f5a1c1ecf024f9a8b82cca949a9ee0e91  # v1
    with:
      hub-ref: da7a066f5a1c1ecf024f9a8b82cca949a9ee0e91
      # atrium-project#72 B: api_util/teitok_read.py and bbox_scale.py are nlp-enrich's, pinned by
      # tests/test_vendored_teitok_parity.py; the reusable compares them with nlp-enrich's `test`
      # head, so a copy that falls behind turns red here. atrium-project#83: decision_client.py is
      # page-classification's (tests/test_vendored_decision_parity.py) and decisions/document_type.v1.json
      # digital-convert's (tests/test_vendored_doctype_parity.py), for dm_run.py --doc-type.
      vendored-from: atrium-nlp-enrich atrium-page-classification atrium-digital-convert
